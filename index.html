<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockney Cards — Coming Soon</title>
<meta name="description" content="Cockney Cards is coming soon.">
<style>
  :root {
    --navy: #1b2340;
    --gold: #c8a04d;
    --cream: #f4efe6;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 20%, #2a3358 0%, var(--navy) 55%, #10152a 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    color: var(--cream);
  }

  .container {
    text-align: center;
    max-width: 480px;
    width: 100%;
  }

  .image-wrap {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  .image-wrap img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.45));
  }

  h1 {
    letter-spacing: 0.18em;
    font-size: 1.6rem;
    text-transform: uppercase;
    color: var(--gold);
    margin: 8px 0 6px;
  }

  p.tagline {
    color: rgba(244, 239, 230, 0.75);
    font-size: 1rem;
    margin: 0 0 24px;
    letter-spacing: 0.03em;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: var(--gold);
    margin: 20px auto;
    opacity: 0.7;
  }

  .notify {
    font-size: 0.85rem;
    color: rgba(244, 239, 230, 0.6);
  }

  .notify a {
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid rgba(200, 160, 77, 0.4);
  }

  .notify a:hover {
    border-bottom-color: var(--gold);
  }

  footer {
    margin-top: 32px;
    font-size: 0.75rem;
    color: rgba(244, 239, 230, 0.4);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="image-wrap">
      <img src="https://images.cockneycards.com/comingsoon.png" alt="Cockney Cards — a pinstripe-suited lion mascot in front of London landmarks, holding a Coming Soon sign">
    </div>

    <div class="divider"></div>

    <p class="tagline">A proper new deck of cards is on its way.</p>

    <p class="notify">
      Want a nudge when we launch? Drop us a line at
      <a href="mailto:hello@cockneycards.com">hello@cockneycards.com</a>
    </p>

    <footer>&copy; 2026 Cockney Cards. All rights reserved.</footer>
  </div>
</body>
</html>
