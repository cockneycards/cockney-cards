<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockney Cards | Coming Soon</title>
<meta name="description" content="Cockney Cards is coming soon.">

<style>
    :root { --primary: #1A73E8; --dark: #1e1e24; --light: #fcfcfc; --border-color: #e0e0e0; --gold: #c8a04d; --font-family: 'Helvetica Neue', Arial, sans-serif; }
    html, body { height: 100%; }
    body {
        font-family: var(--font-family);
        margin: 0;
        padding: 0;
        background-color: white;
        color: var(--dark);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* HEADER — matches shop pages */
    header { background-color: white; padding: 15px 40px 10px 40px; border-bottom: 1px solid var(--border-color); }
    .header-top { display: flex; justify-content: center; align-items: center; max-width: 1400px; margin: 0 auto; }
    .logo-container { text-align: center; }
    .logo-container img { max-width: 120px; height: auto; }

    /* MAIN — coming soon content */
    main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .container { text-align: center; max-width: 480px; width: 100%; }

    .image-wrap { width: 100%; max-width: 620px; margin: 0 auto; }
    .image-wrap img { width: 100%; height: auto; display: block; }

    h1 {
        letter-spacing: 0.14em;
        font-size: 1.4rem;
        text-transform: uppercase;
        color: var(--dark);
        margin: 24px 0 8px;
        font-weight: 600;
    }

    p.tagline {
        color: #666;
        font-size: 1rem;
        margin: 0 0 24px;
        letter-spacing: 0.02em;
    }

    .divider { width: 60px; height: 2px; background: var(--gold); margin: 20px auto; opacity: 0.8; }

    .notify { font-size: 0.9rem; color: #666; }
    .notify a { color: var(--primary); text-decoration: none; border-bottom: 1px solid rgba(26, 115, 232, 0.3); }
    .notify a:hover { border-bottom-color: var(--primary); }

    /* FOOTER — matches shop pages */
    footer { border-top: 1px solid var(--border-color); padding: 40px 40px 20px 40px; background-color: white; }
    .footer-grid { max-width: 1300px; margin: 0 auto; display: flex; justify-content: center; gap: 60px; flex-wrap: wrap; }
    .footer-col { font-size: 13px; line-height: 1.8; color: #333; text-align: left; }
    .footer-col h4 { font-size: 14px; font-weight: bold; margin: 0 0 20px; letter-spacing: 0.5px; }
    .footer-col p { margin: 0 0 15px 0; }
    .footer-col a { color: #111; text-decoration: underline; }
    .footer-bottom { max-width: 1300px; margin: 30px auto 0 auto; border-top: 1px solid #f0f0f0; padding-top: 20px; text-align: center; font-size: 11px; color: #888; letter-spacing: 0.5px; }
</style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="logo-container">
            <img src="https://images.cockneycards.com/logo.png" alt="Cockney Cards">
        </div>
    </div>
</header>

<main>
    <div class="container">
        <div class="image-wrap">
            <img src="https://images.cockneycards.com/comingsoonlogo.png" alt="Cockney Cards — a pinstripe-suited lion mascot in front of London landmarks, holding a Coming Soon sign">
        </div>

        <div class="divider"></div>

        <p class="tagline">Our website is coming soon.</p>

        <p class="notify">
            Want a nudge when we launch? Drop us an email at
            <a href="mailto:contact@cockneycards.com">contact@cockneycards.com</a>
        </p>
    </div>
</main>

<footer>
    <div class="footer-grid">
        <div class="footer-col">
            <h4>Contact Us</h4>
            <p><strong>Email:</strong><br><a href="mailto:contact@cockneycards.com">contact@cockneycards.com</a></p>
            <p><strong>Instagram:</strong><br><a href="https://www.instagram.com/cockneycards.ig" target="_blank">@cockneycards.ig</a></p>
        </div>
        <div class="footer-col">
            <h4>Business Hours</h4>
            <p><strong>Mon - Fri:</strong><br>9am - 5pm</p>
            <p><strong>Saturday:</strong><br>10am - 4pm</p>
            <p><strong>Sunday:</strong><br>Closed</p>
        </div>
    </div>
    <div class="footer-bottom">&copy; 2026 by Cockney Cards.</div>
</footer>

</body>
</html>
